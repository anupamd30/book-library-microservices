name: Build and deploy ASP.Net Core app to Azure Web App - api-gateways-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ./ApiGateway/ApiGateway.csproj

      - name: Build project
        run: dotnet build ./ApiGateway/ApiGateway.csproj --configuration Release --no-restore

      - name: Publish project
        run: dotnet publish ./ApiGateway/ApiGateway.csproj -c Release -o publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-gateways-api'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: publish