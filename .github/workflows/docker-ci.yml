name: Docker CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - develop
      - main

jobs:
  docker-build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AuthService
        run: docker build -t authservice ./AuthService

      - name: Build BookService
        run: docker build -t bookservice ./BookService

      - name: Build BorrowService
        run: docker build -t borrowservice ./BorrowService

      - name: Build ApiGateway
        run: docker build -t apigateway ./ApiGateway